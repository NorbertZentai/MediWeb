name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  packages: write

jobs:
  # 2.1 — Build + teszt (valódi PostgreSQL service ellen, ./mvnw verify)
  backend-test:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediWeb_Backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mediweb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mediweb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            MediWeb_Backend/target/surefire-reports/
            MediWeb_Backend/target/site/jacoco/
          if-no-files-found: ignore

  # 2.2 — Docker image build (push a GHCR-be csak master/develop push esetén)
  docker-build:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on branch pushes)
        uses: docker/build-push-action@v6
        with:
          context: MediWeb_Backend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.3 — Deploy: később (a hosting irány eldöntése után). A korábban tervezett
  # Render deploy job ideiglenesen eltávolítva, mert a Render DB törölve lett.
